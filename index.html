<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <main>
      <h1>Lista de tareas</h1>

      <form id="formulario-agregar">
        <label for="texto-tarea">Nueva Tarea</label>
        <div class="fila">
          <input id="texto-tarea" type="text" autocomplete="off" required />
          <button type="submit">Agregar</button>
        </div>
      </form>

      <p id="contador" aria-live="polite"></p>

      <div id="vistas" class="vistas" role="group" aria-label="Vista">
        <button type="button" data-vista="todas" aria-pressed="true">Todas</button>
        <button type="button" data-vista="pendientes" aria-pressed="false">Pendientes</button>
        <button type="button" data-vista="hechas" aria-pressed="false">Hechas</button>
      </div>

      <ul id="lista" aria-label="Tareas"></ul>
      <p id="vista-vacia" hidden></p>

      <div id="archivo" class="archivo" role="group" aria-label="Archivo">
        <button type="button" id="exportar">Exportar</button>
        <button type="button" id="importar">Importar</button>
        <input type="file" id="archivo-a-importar" accept=".json,application/json" hidden />
      </div>
      <p id="aviso" role="status"></p>
    </main>

    <script src="src/lista-de-tareas.js"></script>
    <script src="src/interfaz.js"></script>
  </body>
</html>
